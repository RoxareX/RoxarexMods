plugins {
	// Building
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id "com.diffplug.spotless" version "${spotless_version}"
	// Publishing
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "${mod_publish_plugin_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	flatDir {
		dirs 'libs'
	}

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	maven { url "https://maven.shedaniel.me" }
	maven { url "https://maven.terraformersmc.com/releases/" }

	// YACL
	maven {
		url = "https://maven.isxander.dev/releases"

		content {
			includeGroup "dev.isxander"
			includeGroup "org.quiltmc.parsers"
		}
	}
	maven {
		url = "https://maven.azureaaron.net/releases"

		content {
			includeGroup "net.azureaaron"
		}
	}

	maven {
		url = "https://maven.azureaaron.net/snapshots"

		content {
			includeGroup "net.azureaaron"
		}
	}
	// For Minecraft snapshots
	maven {
		url = "https://maven.isxander.dev/snapshots"

		content {
			includeGroup "dev.isxander"
		}
	}

	// For NEU repo parser
	exclusiveContent {
		forRepository {
			maven { url = "https://repo.nea.moe/releases" }
		}

		filter {
			includeGroup "moe.nea"
		}
	}

	mavenCentral() // for JGit and other plain Java libs
}

dependencies {
	// To change the versions see the gradle.properties file
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Loom does not always add this
	implementation "ca.weblite:java-objc-bridge:1.1"

//	mappings loom.layered {
//		officialMojangMappings()
//	}

	compileOnly "com.demonwav.mcdev:annotations:${project.mcdev_annotations_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mod Menu
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"

	// Dandelion (also shades in MoulConfig)
	include implementation("net.azureaaron:dandelion:${project.dandelion_version}")

	// HM API (Hypixel Mod API Library)
	include implementation("net.azureaaron:hm-api:${project.hm_api_version}")

	// Fabric Language Kotlin for using MoulConfig - we are still a Java-exclusive mod
	implementation("net.fabricmc:fabric-language-kotlin:${project.flk_version}")

	// NEU RepoParser
	include implementation("moe.nea:neurepoparser:${project.repoparser_version}")

	// Apache Commons Math
	include implementation("org.apache.commons:commons-math3:${project.commons_math_version}")

	// Apache Commons Text
	include implementation("org.apache.commons:commons-text:${project.commons_text_version}")
	// TwelveMonkeys ImageIO - provides ImageInputStreamSpi on JDK 21+
//	include implementation("com.twelvemonkeys.imageio:imageio-core:3.11.0")
//	include implementation("com.twelvemonkeys.imageio:imageio-stream:3.11.0")
//	include implementation("com.twelvemonkeys.imageio:imageio-stream:3.9.4")

	// Legacy Item DFU
	include implementation("net.azureaaron:legacy-item-dfu:${project.legacy_item_dfu_version}")

	// Skyblocker from libs and its dependencies 	#Start#
	compileOnly "maven.modrinth:skyblocker-liap:${project.skyblocker_version}"
	runtimeOnly "maven.modrinth:skyblocker-liap:${project.skyblocker_version}"
	// YACL
	include implementation("dev.isxander:yet-another-config-lib:${project.yacl_version}-fabric")
	// Skyblocker's transitive deps (Modrinth Maven won't pull these automatically)
	include implementation("org.eclipse.jgit:org.eclipse.jgit:${project.jgit_version}")
	// Networth Calculator (https://github.com/AzureAaron/networth-calculator)
	include implementation("net.azureaaron:networth-calculator:${project.networth_calculator_version}")
	// JSpecify Annotations
	include implementation("org.jspecify:jspecify:1.0.0")
	// End of Skyblocker Dependencies				#End#
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}